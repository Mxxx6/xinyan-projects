<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — 抖音数据分析</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">📊</span>
                    <h1 class="text-xl font-bold text-gray-900">抖音数据分析平台</h1>
                    {% if demo_mode %}
                    <span class="px-2 py-1 text-xs font-medium bg-amber-100 text-amber-700 rounded-full">
                        演示模式
                    </span>
                    {% else %}
                    <span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-700 rounded-full">
                        实时模式
                    </span>
                    {% endif %}
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-sm font-medium px-3 py-2 rounded-md transition-colors
                              {% if title == '数据仪表盘' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                        仪表盘
                    </a>
                    <a href="/videos" class="text-sm font-medium px-3 py-2 rounded-md transition-colors
                              {% if title == '视频列表' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                        视频列表
                    </a>
                    <a href="/analyze" class="text-sm font-medium px-3 py-2 rounded-md transition-colors
                              {% if title == '视频分析' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                        视频分析
                    </a>
                    <a href="/settings" class="text-sm font-medium px-3 py-2 rounded-md transition-colors
                              {% if title == '系统设置' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                        设置
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 bg-white mt-12">
        <div class="max-w-7xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
            抖音数据分析平台 — 数据最后更新于 <span id="last-refresh">加载中...</span>
        </div>
    </footer>

    <script>
        // Update footer timestamp
        document.getElementById('last-refresh').textContent = new Date().toLocaleString('zh-CN');
    </script>
</body>
</html>
