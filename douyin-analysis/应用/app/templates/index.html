{% extends "base.html" %}
{% block content %}

<!-- Refresh Button -->
<div class="flex justify-end mb-4">
    <button id="refresh-btn" onclick="refreshData()"
            class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg
                   hover:bg-indigo-700 transition-colors shadow-sm">
        🔄 刷新数据
    </button>
</div>

<!-- KPI Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
    <div class="kpi-card">
        <div class="kpi-label">👁 总播放量</div>
        <div class="kpi-value" id="kpi-plays">---</div>
        <div class="kpi-sub">累计播放次数</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">❤️ 总点赞</div>
        <div class="kpi-value" id="kpi-likes">---</div>
        <div class="kpi-sub">累计点赞数</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">💬 总评论</div>
        <div class="kpi-value" id="kpi-comments">---</div>
        <div class="kpi-sub">累计评论数</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">🔄 总分享</div>
        <div class="kpi-value" id="kpi-shares">---</div>
        <div class="kpi-sub">累计分享次数</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">📈 平均互动率</div>
        <div class="kpi-value" id="kpi-engagement">---</div>
        <div class="kpi-sub">(赞+评+享)/播放</div>
    </div>
</div>

<!-- Charts Grid — Row 1 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <!-- Trend Line Chart -->
    <div class="chart-container">
        <div class="chart-title">📊 30天数据趋势</div>
        <div class="chart-box" id="trend-chart"></div>
    </div>
    <!-- Top Videos Bar Chart -->
    <div class="chart-container">
        <div class="chart-title">🏆 Top 10 视频播放量</div>
        <div class="chart-box" id="top-videos-chart"></div>
    </div>
</div>

<!-- Charts Grid — Row 2 -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <!-- Engagement Donut -->
    <div class="chart-container">
        <div class="chart-title">🍩 互动构成分析</div>
        <div class="chart-box" id="engagement-donut"></div>
    </div>
    <!-- Posting Hour Distribution -->
    <div class="chart-container">
        <div class="chart-title">⏰ 发布时间互动分布</div>
        <div class="chart-box" id="posting-hour-chart"></div>
    </div>
</div>

<!-- Top Videos Table -->
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <div class="chart-title">🔥 热门视频排行</div>
    <div class="overflow-x-auto">
        <table class="top-videos-table">
            <thead>
                <tr>
                    <th class="w-12">排名</th>
                    <th>视频标题</th>
                    <th>播放量</th>
                    <th>点赞</th>
                    <th>评论</th>
                    <th>互动率</th>
                    <th>趋势</th>
                </tr>
            </thead>
            <tbody id="top-videos-tbody">
                <tr><td colspan="7" class="text-center text-gray-400 py-8">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/js/dashboard.js"></script>
{% endblock %}
